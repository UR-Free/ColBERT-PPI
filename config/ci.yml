name: Scoring and package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quickstart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: src/pyproject.toml
      - run: python -m pip install -e './src[dev]'
      - run: python -m pytest -q src/tests
      - run: OPENBLAS_NUM_THREADS=1 python src/run_example.py
      - run: python -m build src
