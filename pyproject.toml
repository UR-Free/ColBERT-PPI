[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colbert-ppi"
version = "0.1.0"
description = "Structure-aware residue-explicit protein-pair scoring"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "peft>=0.14",
  "scikit-learn>=1.4",
  "torch>=2.6",
  "tqdm>=4.66",
  "transformers>=4.48"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9"
]

[project.scripts]
colbert-ppi-prepare-data = "colbert_ppi.cli.prepare_data:main"
colbert-ppi-train = "colbert_ppi.cli.train_ppi:main"
colbert-ppi-evaluate = "colbert_ppi.cli.evaluate_ppi:main"
colbert-ppi-train-protein-nucleic = "colbert_ppi.cli.train_protein_nucleic:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["colbert_ppi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
