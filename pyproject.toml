[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colbert-ppi"
version = "0.1.0"
description = "Structure-aware residue-explicit protein-pair scoring"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "peft>=0.14",
  "scikit-learn>=1.4",
  "torch>=2.6",
  "tqdm>=4.66",
  "transformers>=4.48"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9"
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
